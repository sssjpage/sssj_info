<title>신나무실 5단지 리모델링 대책 활동 가이드</title>
<style>
  :root{
    --bg:#ffffff;
    --surface-2:#f3f6f9;
    --ink:#101828;
    --ink-soft:#43536a;
    --ink-faint:#6b7c90;
    --line:#dbe3ea;
    --stop:#c1440e;
    --stop-ink:#ffffff;
    --brand:#1f4d7a;
    --brand-ink:#eaf2fa;
    --fs-base:23px;
  }
  @media (min-width:420px){ :root{ --fs-base:25px; } }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1720; --surface-2:#182c3c;
      --ink:#eef3f7; --ink-soft:#b7c6d4; --ink-faint:#8ea0b2;
      --line:#274255;
      --stop:#ff7a45; --stop-ink:#1a0d05;
      --brand:#6fb1e8; --brand-ink:#0c2338;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1720; --surface-2:#182c3c;
    --ink:#eef3f7; --ink-soft:#b7c6d4; --ink-faint:#8ea0b2;
    --line:#274255;
    --stop:#ff7a45; --stop-ink:#1a0d05;
    --brand:#6fb1e8; --brand-ink:#0c2338;
  }

  html{ font-size:var(--fs-base); }
  html.big-text{ --fs-base:29px; }
  @media (min-width:420px){ html.big-text{ --fs-base:32px; } }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-weight:500;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  h1{ text-wrap:balance; font-weight:900; color:var(--ink); }
  button{ font-family:inherit; }
  :focus-visible{ outline:3px solid var(--brand); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  .fontbar{
    display:flex; align-items:center; justify-content:center; gap:.6rem;
    background:var(--surface-2); border-bottom:1px solid var(--line);
    padding:.6rem 1rem;
  }
  .fontbar-label{ font-size:.85rem; color:var(--ink-soft); font-weight:700; margin-right:.2rem; }
  .fontbar-btn{
    border:2px solid var(--line); background:var(--bg); color:var(--ink);
    border-radius:.6rem; padding:.5rem 1rem; font-weight:800; font-size:.95rem;
    min-height:2.6rem; cursor:pointer;
  }
  .fontbar-btn[aria-pressed="true"]{ background:var(--brand); border-color:var(--brand); color:var(--brand-ink); }

  .page{ max-width:30rem; margin:0 auto; padding:2rem 1.15rem 3rem; text-align:center; }

  .kicker{ font-size:.85rem; font-weight:700; color:var(--brand); margin:0 0 .5rem; }
  h1{ font-size:1.7rem; margin:0 0 .7rem; }
  .hero-date{ font-size:1.05rem; color:var(--ink-soft); margin:0 0 1.8rem; }
  .hero-date strong{ color:var(--ink); }
  #dday{ font-weight:800; color:var(--stop); }

  .clarify-note{
    font-size:.95rem; font-weight:600; color:var(--ink-soft);
    background:var(--surface-2); border:1px solid var(--line);
    border-radius:.9rem; padding:.9rem 1.1rem; margin:0 0 1.8rem;
  }

  .rules{ display:flex; flex-direction:column; gap:1rem; margin:0; }
  .rule-card{
    background:var(--stop); color:var(--stop-ink);
    border-radius:1.4rem; padding:1.9rem 1.2rem;
    box-shadow:0 10px 26px -8px var(--stop);
  }
  .rule-title{ font-size:2.9rem; font-weight:900; letter-spacing:-.02em; line-height:1.1; margin:0 0 .45rem; }
  .rule-desc{ font-size:1.08rem; font-weight:700; margin:0; opacity:.95; }

  .hero-note{ font-size:1.15rem; font-weight:800; color:var(--ink); margin:2rem 0 0; }

  .cta-btn{
    display:flex; align-items:center; justify-content:center; gap:.5rem;
    background:var(--brand); color:var(--brand-ink); border-radius:1rem;
    padding:1.1rem 1.2rem; text-decoration:none; font-weight:800; font-size:1.08rem;
    min-height:3.3rem; margin:2rem 0 0;
  }

  .nav-links{ display:flex; flex-direction:column; gap:.7rem; margin:1.2rem 0 0; }
  .nav-btn{
    display:flex; align-items:center; justify-content:space-between; gap:.6rem;
    background:var(--surface-2); border:1px solid var(--line); border-radius:1rem;
    padding:1.1rem 1.2rem; text-decoration:none; color:var(--ink);
    font-weight:800; font-size:1.05rem; min-height:3.2rem; text-align:left;
  }
  .nav-btn .arrow{ color:var(--brand); font-size:1.3rem; flex:none; }

  footer{ margin-top:3rem; padding-top:1.2rem; border-top:1px solid var(--line); font-size:.8rem; color:var(--ink-faint); }
</style>

<div class="fontbar" role="group" aria-label="글자 크기 선택">
  <span class="fontbar-label">글자 크기</span>
  <button type="button" id="btn-normal" class="fontbar-btn" aria-pressed="true">보통</button>
  <button type="button" id="btn-big" class="fontbar-btn" aria-pressed="false">크게</button>

  <div class="rules">

      <p class="rule-title">무제출</p>
      <p class="rule-desc">서류 서명·제출 금지</p>

      <p class="rule-title">무응답</p>

  <div class="nav-links">

  <footer>
    <p>최종 수정 2026-08-19 13:31</p>
  </footer>
</div>

<script>
  (function(){
    var target = new Date(2026, 8, 12);
    var today = new Date(); today.setHours(0,0,0,0);
    var diff = Math.round((target - today) / 86400000);
    var el = document.getElementById('dday');
    if (diff > 0) el.textContent = '오늘로부터 ' + diff + '일 남음';
    else if (diff === 0) el.textContent = '오늘입니다';
    else el.textContent = '총회 종료';
  })();

  (function(){
    var html = document.documentElement;
    var btnN = document.getElementById('btn-normal');
    var btnB = document.getElementById('btn-big');
    function setSize(big){
      html.classList.toggle('big-text', big);
      btnN.setAttribute('aria-pressed', String(!big));
      btnB.setAttribute('aria-pressed', String(big));
      try{ localStorage.setItem('sssj-fontsize', big ? 'big' : 'normal'); }catch(e){}
    }
    btnN.addEventListener('click', function(){ setSize(false); });
    btnB.addEventListener('click', function(){ setSize(true); });
    try{
      if (localStorage.getItem('sssj-fontsize') === 'big') setSize(true);
    }catch(e){}
  })();
</script>
