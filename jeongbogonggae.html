<title>정보공개 요청 방법 · 신나무실 5단지</title>
<style>
  :root{
    --bg:#ffffff; --surface-2:#f3f6f9;
    --ink:#101828; --ink-soft:#43536a; --ink-faint:#6b7c90;
    --line:#dbe3ea; --stop:#c1440e;
    --brand:#1f4d7a; --brand-bg:#e9f0f7; --brand-ink:#eaf2fa;
    --fs-base:23px;
  }
  @media (min-width:420px){ :root{ --fs-base:25px; } }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1720; --surface-2:#182c3c;
      --ink:#eef3f7; --ink-soft:#b7c6d4; --ink-faint:#8ea0b2;
      --line:#274255; --stop:#ff7a45;
      --brand:#6fb1e8; --brand-bg:#152c3e; --brand-ink:#0c2338;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1720; --surface-2:#182c3c;
    --ink:#eef3f7; --ink-soft:#b7c6d4; --ink-faint:#8ea0b2;
    --line:#274255; --stop:#ff7a45;
    --brand:#6fb1e8; --brand-bg:#152c3e; --brand-ink:#0c2338;
  }
  html{ font-size:var(--fs-base); }
  html.big-text{ --fs-base:29px; }
  @media (min-width:420px){ html.big-text{ --fs-base:32px; } }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-weight:500; line-height:1.75; -webkit-font-smoothing:antialiased;
  }
  h1{ text-wrap:balance; font-weight:900; color:var(--ink); }
  :focus-visible{ outline:3px solid var(--brand); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  .fontbar{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; justify-content:center; gap:.6rem;
    background:var(--surface-2); border-bottom:1px solid var(--line);
    padding:.6rem 1rem;
  }
  .fontbar-label{ font-size:.85rem; color:var(--ink-soft); font-weight:700; margin-right:.2rem; }
  .fontbar-btn{
    border:2px solid var(--line); background:var(--bg); color:var(--ink);
    border-radius:.6rem; padding:.5rem 1rem; font-weight:800; font-size:.95rem;
    min-height:2.6rem; cursor:pointer;
  }
  .fontbar-btn[aria-pressed="true"]{ background:var(--brand); border-color:var(--brand); color:var(--brand-ink); }

  .page{ max-width:34rem; margin:0 auto; padding:1.4rem 1.15rem 4rem; }
  .back{ display:inline-flex; align-items:center; gap:.3rem; color:var(--brand); font-weight:800; text-decoration:none; font-size:.98rem; margin-bottom:1.2rem; }
  h1{ font-size:1.55rem; margin:0 0 .8rem; }
  .lede{ color:var(--ink-soft); margin:0 0 1.8rem; }

  .steps{ list-style:none; margin:0 0 1.8rem; padding:0; counter-reset:step; }
  .steps li{
    display:flex; gap:.9rem; align-items:flex-start;
    padding:1rem 0; border-bottom:1px solid var(--line);
  }
  .steps li:last-child{ border-bottom:none; }
  .steps .num{
    flex:none; width:2.1rem; height:2.1rem; border-radius:50%;
    background:var(--brand); color:var(--brand-ink);
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:1rem;
  }
  .steps .txt{ font-weight:700; color:var(--ink); padding-top:.15rem; }

  .callout{
    border-radius:1rem; padding:1.1rem 1.2rem; margin:0 0 1.4rem;
    font-weight:700;
  }
  .callout.warn{
    background:var(--surface-2); border:1px solid var(--line); color:var(--ink);
  }
  .callout.alert{
    background:var(--brand-bg); border:1px solid var(--brand); color:var(--ink);
  }
  .callout .icon{ margin-right:.35rem; }

  footer{ margin-top:3rem; padding-top:1.2rem; border-top:1px solid var(--line); font-size:.8rem; color:var(--ink-faint); }
</style>

<div class="fontbar" role="group" aria-label="글자 크기 선택">
  <span class="fontbar-label">글자 크기</span>
  <button type="button" id="btn-normal" class="fontbar-btn" aria-pressed="true">보통</button>
  <button type="button" id="btn-big" class="fontbar-btn" aria-pressed="false">크게</button>
</div>

<div class="page">
  <a class="back" href="index.html">‹ 처음으로</a>
  <h1>📢 조합 정보공개 요청 방법</h1>
  <p class="lede">조합원이라면 누구나 조합에 정보공개를 요청할 수 있습니다. 아래 순서대로 진행해주세요.</p>

  <ol class="steps">
    <li>
      <span class="num">1</span>
      <span class="txt">신분증 지참</span>
    </li>
    <li>
      <span class="num">2</span>
      <span class="txt">요청서 작성 (부동산에 비치되어 있습니다)</span>
    </li>
    <li>
      <span class="num">3</span>
      <span class="txt">조합사무실 방문 접수</span>
    </li>
    <li>
      <span class="num">4</span>
      <span class="txt">접수증 수령</span>
    </li>
    <li>
      <span class="num">5</span>
      <span class="txt">지연될 경우 접수 문자 요청</span>
    </li>
  </ol>

  <div class="callout warn">
    <span class="icon">⚠️</span>조합원의 정당한 권리입니다. 접수증과 문자는 반드시 보관해주세요.
  </div>

  <div class="callout alert">
    <span class="icon">📌</span>부동산에 동·호수, 이름, 전화번호를 기재할 때는 신중해주세요. 반대 조합원 명부로 활용될 수 있습니다.
  </div>

  <footer>
  </footer>
</div>

<script>
  (function(){
    var html = document.documentElement;
    var btnN = document.getElementById('btn-normal');
    var btnB = document.getElementById('btn-big');
    function setSize(big){
      html.classList.toggle('big-text', big);
      btnN.setAttribute('aria-pressed', String(!big));
      btnB.setAttribute('aria-pressed', String(big));
      try{ localStorage.setItem('sssj-fontsize', big ? 'big' : 'normal'); }catch(e){}
    }
    btnN.addEventListener('click', function(){ setSize(false); });
    btnB.addEventListener('click', function(){ setSize(true); });
    try{
      if (localStorage.getItem('sssj-fontsize') === 'big') setSize(true);
    }catch(e){}
  })();
</script>
